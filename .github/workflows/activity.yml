name: Refresh contribution activity
on:
  workflow_dispatch:
  schedule:
    - cron: '27 2 * * *'
permissions:
  contents: write
concurrency:
  group: profile-activity
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
      - name: Render from GitHub contribution calendar
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_ACTIVITY_TOKEN: ${{ secrets.PROFILE_ACTIVITY_TOKEN }}
        run: python scripts/render_activity.py --mode live
      - name: Publish updated animation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity.gif
          git diff --cached --quiet || (git commit -m 'chore: refresh contribution animation' && git push)
